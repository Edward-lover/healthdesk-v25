<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#2e8b57"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="HealthDesk"
    >

    <title>HealthDesk - School Clinic</title>


   

    <link
        rel="manifest"
        href="./manifest.json"
    >



    <link
        rel="apple-touch-icon"
        href="./icon-192.png"
    >




    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


 

    <header class="top-header">

        <div class="brand">

            <img
                src="./icon-192.png"
                alt="HealthDesk Logo"
                class="header-logo"
            >

            <div>

                <h1>HEALTHDESK</h1>

                <p>School Clinic</p>

            </div>

        </div>


    

        <button
            id="installBtn"
            class="install-btn"
            type="button"
        >
            📱 Download App
        </button>

    </header>




    <main class="auth-container">


    

        <section
            id="loginSection"
            class="auth-card"
        >

            <h2>Welcome to HealthDesk</h2>

            <p class="subtitle">
                School Clinic Appointment System
            </p>


            <form id="loginForm">


                <!-- EMAIL -->

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >


          

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >


             

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Login
                </button>



                <p
                    id="loginMessage"
                    class="message"
                ></p>

            </form>


            <!-- SWITCH TO SIGN UP -->

            <p class="switch-text">

                Don't have an account?

                <button
                    type="button"
                    id="showSignup"
                    class="link-btn"
                >
                    Create an account
                </button>

            </p>


            <!-- ADMIN LOGIN -->

            <p class="switch-text admin-login-link">

                Clinic Administrator?

                <a
                    href="admin-login.html"
                    class="link-btn"
                >
                    Admin Login
                </a>

            </p>

        </section>



        <section
            id="signupSection"
            class="auth-card hidden"
        >

            <h2>Create your Account</h2>

            <p class="subtitle">
                Register for HealthDesk
            </p>


            <form id="signupForm">


              

                <label for="signupName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >




                <label for="signupUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="signupUsername"
                    placeholder="Create a username"
                    autocomplete="username"
                    required
                >


                <!-- STUDENT ID -->

                <label for="signupStudentId">
                    Student ID
                </label>

                <input
                    type="text"
                    id="signupStudentId"
                    placeholder="Enter your student ID"
                    required
                >


    

                <label for="signupEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >



                <label for="signupPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >



                <label for="signupConfirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="signupConfirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >



                <button
                    type="submit"
                    class="primary-btn"
                >
                    Create Account
                </button>


                <!-- SIGN UP MESSAGE -->

                <p
                    id="signupMessage"
                    class="message"
                ></p>

            </form>



            <p class="switch-text">

                Already have an account?

                <button
                    type="button"
                    id="showLogin"
                    class="link-btn"
                >
                    Log in
                </button>

            </p>


         

            <p class="switch-text admin-login-link">

                Clinic Administrator?

                <a
                    href="admin-login.html"
                    class="link-btn"
                >
                    Admin Login
                </a>

            </p>

        </section>

    </main>


    <div
        id="downloadOverlay"
        class="download-overlay hidden"
    >

        <div class="download-box">

            <div class="download-icon">
                📱
            </div>


            <h2 id="downloadTitle">
                Preparing HealthDesk
            </h2>


            <p id="downloadMessage">
                Preparing the app...
            </p>


            <!-- PROGRESS BAR -->

            <div class="progress-container">

                <div
                    id="downloadProgressBar"
                    class="progress-bar"
                ></div>

            </div>


            <!-- COUNTDOWN -->

            <p
                id="downloadCountdown"
                class="download-countdown"
            >
                5
            </p>

        </div>

    </div>




    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>



    <script src="./script.js"></script>


 
    <script>

        window.addEventListener(
            "load",
            () => {

                console.log(
                    "HealthDesk index page loaded."
                );


                if (
                    "serviceWorker" in navigator
                ) {

                    navigator.serviceWorker
                        .getRegistration()
                        .then(
                            registration => {

                                if (registration) {

                                    console.log(
                                        "Service worker is active."
                                    );

                                } else {

                                    console.warn(
                                        "Service worker is NOT registered."
                                    );

                                }

                            }
                        )
                        .catch(
                            error => {

                                console.error(
                                    "Service worker check failed:",
                                    error
                                );

                            }
                        );

                }

            }
        );

    </script>


</body>

</html>
