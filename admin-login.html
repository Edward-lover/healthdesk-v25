<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#2e8b57"
    >

    <title>HealthDesk - Admin Login</title>

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <header class="top-header">

        <div class="brand">

            <img
                src="icon-192.png"
                alt="HealthDesk Logo"
                class="header-logo"
            >

            <div>

                <h1>HEALTHDESK</h1>

                <p>School Clinic</p>

            </div>

        </div>

    </header>


 

    <main class="auth-container">

        <section class="auth-card">

            <h2>Admin Login</h2>

            <p class="subtitle">
                Clinic Administrator
            </p>


            <form id="adminLoginForm">

                <label for="adminEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="adminEmail"
                    name="adminEmail"
                    placeholder="Enter admin email"
                    autocomplete="email"
                    required
                >


                <label for="adminPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    name="adminPassword"
                    placeholder="Enter admin password"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="submit"
                    class="primary-btn"
                >
                    Admin Login
                </button>


                <p
                    id="adminLoginMessage"
                    class="message"
                ></p>

            </form>


            <p class="switch-text">

                Are you a student?

                <a
                    href="index.html"
                    class="link-btn"
                >
                    Student Login
                </a>

            </p>

        </section>

    </main>




    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


   

    <script src="script.js"></script>

</body>

</html>
